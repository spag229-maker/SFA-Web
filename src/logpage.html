<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Frost App</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
<header id="header">
    <div class="main-container">
        <img src="/assets/images/Logo.png" class="logo" alt="">
        <h1 id="LogTitle">Smart Frost App</h1>
    </div>
</header>

<main class="main-container">
    <div class="register-page">
        <h1>Регистрация</h1>

        <form class="register-form">
            <div class="input-group">
                <label for="name"></label>
                <input id="name" name="name" type="text" placeholder="Имя">
                <span class="error-message" id="err-name">Поле Full Name может содержать только буквы</span>
            </div>

            <div class="input-group">
                <label for="email"></label>
                <input id="email" name="email" type="email" placeholder="Почта">
                <span class="error-message" id="err-email">Введите корректный E-mail</span>
            </div>

            <div class="input-group password">
                <label for="password"></label>
                <input id="password" name="password" type="password" placeholder="Пароль">
                <span class="error-message" id="err-password">Пароль должен содержать не меньше 8 символов</span>
            </div>

            <div class="input-group password">
                <label for="confirm-password"></label>
                <input id="confirm-password" name="confirmPassword" type="password" placeholder="Повторите пароль">
                <span class="error-message" id="err-rpassword">Пароли должны совпадать</span>
            </div>

            <a href="#" id="sign-button-href">
                <button id="sign-button" class="signBtn">Создать аккаунт</button>
            </a>

        </form>
        <button id="logInBtn">
            <a href="#" id="logIn" class="login ">
                Войти в существующий аккаунт
            </a>
        </button>

    </div>
</main>

<script src="scripts/LogPage.js"></script>
</body>
</html>
